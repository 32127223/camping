        .marquee {
            width: 650px;
            height: 150px;
            margin: 0 auto;
            overflow: hidden;
            position: relative;
            border: 10px solid;
            border-image: linear-gradient(to right, rgb(243, 128, 237), rgb(255, 255, 163), rgb(161, 255, 124), rgb(133, 205, 253)) 1;
        }

        .marquee span {
            display: block;
            width: 200%;
            height: 50px;
            position: absolute;
            overflow: hidden;
            animation: marquee 8s linear infinite;
        }

        .marquee span:nth-child(2) {
            left: 100%;
            animation-delay: -2.5s;
        }

        @keyframes marquee {
            0% {
                left: 0;
            }
            100% {
                left: -100%;
            }
